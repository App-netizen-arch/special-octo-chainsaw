name: Flutter Counsel Check

on:
  push:
    paths:
      - "counsel-ai/app/**"
      - ".github/workflows/flutter-counsel-check.yml"
  pull_request:
    paths:
      - "counsel-ai/app/**"
      - ".github/workflows/flutter-counsel-check.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: counsel-ai/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
