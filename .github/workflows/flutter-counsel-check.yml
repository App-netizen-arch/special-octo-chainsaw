name: Flutter Counsel Check

on:
  push:
    paths:
      - "counsel-ai/app/**"
      - ".github/workflows/flutter-counsel-check.yml"
  pull_request:
    paths:
      - "counsel-ai/app/**"
      - ".github/workflows/flutter-counsel-check.yml"

jobs:
  analyze:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: counsel-ai/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
        working-directory: .

      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Install Android API 36
        working-directory: .
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print >&2 || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Install dependencies
        run: flutter pub get

      - name: Repair and format Flutter sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path("lib/screens/home_screen.dart")
          text = home.read_text()
          stripped = text.rstrip()
          if "class _ApiBanner" in text and not stripped.endswith("}\n}"):
              home.write_text(stripped + "\n}\n}\n")
          text = home.read_text().replace('import "../models/models.dart" show ChatMode;', 'import "../models/models.dart";')
          home.write_text(text)

          admin = Path("lib/screens/admin_screen.dart")
          text = admin.read_text().replace("  List<User> _users = [];\n", "")
          admin.write_text(text)

          login = Path("lib/screens/login_screen.dart")
          text = login.read_text()
          text = "\n".join(line for line in text.splitlines() if "final isDark =" not in line) + "\n"
          login.write_text(text)
          PY
          dart fix --apply
          dart format \
            lib/screens/home_screen.dart \
            lib/screens/admin_screen.dart \
            lib/screens/login_screen.dart \
            lib/screens/legal_updates_screen.dart \
            lib/screens/settings_screen.dart \
            lib/screens/skills_screen.dart \
            lib/widgets/verification_report_widget.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Linux debug app
        run: flutter build linux --debug

      - name: Commit automatic source repairs
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No source repairs needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add counsel-ai/app
          git commit -m "fix: repair Flutter analyzer issues [skip ci]"
          git push

  release:
    name: Build and publish release packages
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: counsel-ai/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
        working-directory: .

      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Install Android API 36
        working-directory: .
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux release
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/release/counsel-ai-linux-x64.tar.gz" bundle

      - name: Prepare Android release
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/release/counsel-ai-android.apk"

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0"
          TITLE="Counsel AI v0.1.0"
          NOTES=$'Counsel AI release build.\n\nAndroid: release APK\nLinux: x86_64 release bundle\n\nBuilt and verified by GitHub Actions.'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$GITHUB_WORKSPACE/release/counsel-ai-android.apk" \
              "$GITHUB_WORKSPACE/release/counsel-ai-linux-x64.tar.gz" \
              --clobber
          else
            gh release create "$TAG" \
              "$GITHUB_WORKSPACE/release/counsel-ai-android.apk" \
              "$GITHUB_WORKSPACE/release/counsel-ai-linux-x64.tar.gz" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
